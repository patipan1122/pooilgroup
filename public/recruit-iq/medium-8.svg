<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" font-family="system-ui, sans-serif">
  <!-- b2-medium-2 — TWO RULES: (1) shape is fixed DOWN each column: col1=circle, col2=triangle, col3=square.
       (2) fill alternates ACROSS rows: row1=outline, row2=striped, row3=solid.
       Missing (bottom-right) = col3 shape (SQUARE) + row3 fill (SOLID) => SOLID SQUARE.  CORRECT = D.
       Distractors: outline square / striped square (wrong fill), solid triangle (wrong shape). -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6ea8fe" stroke-width="2.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="720" height="980" rx="18" fill="#0b1120"/>

  <!-- matrix frame -->
  <rect x="70" y="60" width="580" height="380" rx="14" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>

  <!-- Row 1 (outline): circle, triangle, square -->
  <circle cx="200" cy="140" r="32" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <polygon points="360,108 393,172 327,172" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="488" y="108" width="64" height="64" rx="4" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>

  <!-- Row 2 (striped): circle, triangle, square -->
  <circle cx="200" cy="260" r="32" fill="url(#hatch)" stroke="#6ea8fe" stroke-width="2.5"/>
  <polygon points="360,228 393,292 327,292" fill="url(#hatch)" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="488" y="228" width="64" height="64" rx="4" fill="url(#hatch)" stroke="#6ea8fe" stroke-width="2.5"/>

  <!-- Row 3 (solid): circle, triangle, ? -->
  <circle cx="200" cy="380" r="32" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2.5"/>
  <polygon points="360,348 393,412 327,412" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="472" y="332" width="96" height="96" rx="8" fill="none" stroke="#33436b" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="520" y="400" text-anchor="middle" font-size="60" font-weight="700" fill="#6ea8fe">?</text>

  <!-- prompt -->
  <text x="360" y="486" text-anchor="middle" font-size="20" fill="#9db4d8">รูปไหนควรอยู่ตรงเครื่องหมาย ?</text>

  <!-- answer choices -->
  <g>
    <!-- A: outline square (wrong fill) -->
    <g transform="translate(0,0)">
    <rect x="70" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="103" y="553" width="64" height="64" rx="4" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="135" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">A</text>
    </g>

    <!-- B: striped square (wrong fill) -->
    <g transform="translate(70,0)">
    <rect x="225" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="258" y="553" width="64" height="64" rx="4" fill="url(#hatch)" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="290" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">B</text>
    </g>

    <!-- C: solid triangle (wrong shape) -->
    <g transform="translate(140,0)">
    <rect x="380" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <polygon points="445,553 478,617 412,617" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="445" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">C</text>
    </g>

    <!-- D: solid square (CORRECT) -->
    <g transform="translate(-465,210)">
    <rect x="535" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="568" y="553" width="64" height="64" rx="4" fill="#6ea8fe" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="600" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">D</text>
    </g>

    <!-- E: striped triangle (WRONG: wrong shape AND wrong fill) -->
    <rect x="295" y="730" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <polygon points="360,763 393,827 327,827" fill="url(#hatch)" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="360" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">E</text>

    <!-- F: outline circle (WRONG: wrong shape AND wrong fill) -->
    <rect x="520" y="730" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="585" cy="795" r="32" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="585" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">F</text>
  </g>

  <text x="360" y="955" text-anchor="middle" font-size="14" fill="#4a5b7e">ข้อสอบไอคิว (ระดับกลาง) · Buildly Recruit</text>
</svg>
