<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" font-family="system-ui, sans-serif">
  <!-- b2-medium-3 — TWO TOKENS. Each cell = a 3-slot strip (positions 1,2,3). Two marks: X and O.
       Rule X: moves RIGHT by one slot each step, wrapping (1->2->3->1).
       Rule O: moves LEFT by one slot each step, wrapping (3->2->1->3).  (never collide)
       Series across 4 cells (read TL, TR, BL, then ?=BR):
         cell1: X@1 O@3 | cell2: X@2 O@2? NO -> use O three-step: below.
       Actual (chosen to avoid collision): X +1/step, O -1/step from disjoint starts:
         cell1: X@1, O@3 | cell2: X@2, O@1 | cell3: X@3, O@2 | cell4(?): X@1, O@3.
       Missing = X@slot1 (left), O@slot3 (right).  CORRECT = B. -->
  <rect x="0" y="0" width="720" height="780" rx="18" fill="#0b1120"/>

  <!-- matrix frame -->
  <rect x="70" y="60" width="580" height="380" rx="14" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>

  <!-- ===== reusable-ish strip drawing: 3 slot boxes; X = diagonal cross, O = circle ===== -->

  <!-- CELL 1 (top-left) : center (220,150) slots at x=170,220,270 : X@1 O@3 -->
  <g stroke="#2a3a5e" stroke-width="1.5">
    <rect x="150" y="126" width="40" height="48" rx="4" fill="none"/>
    <rect x="200" y="126" width="40" height="48" rx="4" fill="none"/>
    <rect x="250" y="126" width="40" height="48" rx="4" fill="none"/>
  </g>
  <!-- X at slot1 (cx=170) -->
  <g stroke="#6ea8fe" stroke-width="2.5" stroke-linecap="round"><line x1="159" y1="139" x2="181" y2="161"/><line x1="181" y1="139" x2="159" y2="161"/></g>
  <!-- O at slot3 (cx=270) -->
  <circle cx="270" cy="150" r="13" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>

  <!-- CELL 2 (top-right) : center (500,150) slots at x=450,500,550 : X@2 O@1 -->
  <g stroke="#2a3a5e" stroke-width="1.5">
    <rect x="430" y="126" width="40" height="48" rx="4" fill="none"/>
    <rect x="480" y="126" width="40" height="48" rx="4" fill="none"/>
    <rect x="530" y="126" width="40" height="48" rx="4" fill="none"/>
  </g>
  <!-- X at slot2 (cx=500) -->
  <g stroke="#6ea8fe" stroke-width="2.5" stroke-linecap="round"><line x1="489" y1="139" x2="511" y2="161"/><line x1="511" y1="139" x2="489" y2="161"/></g>
  <!-- O at slot1 (cx=450) -->
  <circle cx="450" cy="150" r="13" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>

  <!-- CELL 3 (bottom-left) : center (220,320) slots at x=170,220,270 : X@3 O@2 -->
  <g stroke="#2a3a5e" stroke-width="1.5">
    <rect x="150" y="296" width="40" height="48" rx="4" fill="none"/>
    <rect x="200" y="296" width="40" height="48" rx="4" fill="none"/>
    <rect x="250" y="296" width="40" height="48" rx="4" fill="none"/>
  </g>
  <!-- X at slot3 (cx=270) -->
  <g stroke="#6ea8fe" stroke-width="2.5" stroke-linecap="round"><line x1="259" y1="309" x2="281" y2="331"/><line x1="281" y1="309" x2="259" y2="331"/></g>
  <!-- O at slot2 (cx=220) -->
  <circle cx="220" cy="320" r="13" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>

  <!-- CELL 4 (bottom-right) : the missing one -->
  <rect x="430" y="288" width="140" height="64" rx="8" fill="none" stroke="#33436b" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="500" y="338" text-anchor="middle" font-size="44" font-weight="700" fill="#6ea8fe">?</text>

  <!-- prompt -->
  <text x="360" y="486" text-anchor="middle" font-size="20" fill="#9db4d8">ช่องไหนควรอยู่ตรงเครื่องหมาย ?  (X เลื่อนขวา · O เลื่อนซ้าย)</text>

  <!-- ===== answer choices: each shows a 3-slot strip. correct = X@1 O@3 ===== -->
  <g>
    <!-- A: X@2 O@3 (X misplaced) -->
    <rect x="70" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <g stroke="#2a3a5e" stroke-width="1.5">
      <rect x="88" y="566" width="30" height="40" rx="3" fill="none"/>
      <rect x="120" y="566" width="30" height="40" rx="3" fill="none"/>
      <rect x="152" y="566" width="30" height="40" rx="3" fill="none"/>
    </g>
    <g stroke="#6ea8fe" stroke-width="2.5" stroke-linecap="round"><line x1="126" y1="577" x2="144" y2="595"/><line x1="144" y1="577" x2="126" y2="595"/></g>
    <circle cx="167" cy="586" r="11" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="135" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">A</text>

    <!-- B: X@1 O@3 (CORRECT) -->
    <rect x="225" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <g stroke="#2a3a5e" stroke-width="1.5">
      <rect x="243" y="566" width="30" height="40" rx="3" fill="none"/>
      <rect x="275" y="566" width="30" height="40" rx="3" fill="none"/>
      <rect x="307" y="566" width="30" height="40" rx="3" fill="none"/>
    </g>
    <g stroke="#6ea8fe" stroke-width="2.5" stroke-linecap="round"><line x1="249" y1="577" x2="267" y2="595"/><line x1="267" y1="577" x2="249" y2="595"/></g>
    <circle cx="322" cy="586" r="11" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="290" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">B</text>

    <!-- C: X@1 O@2 (O misplaced) -->
    <rect x="380" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <g stroke="#2a3a5e" stroke-width="1.5">
      <rect x="398" y="566" width="30" height="40" rx="3" fill="none"/>
      <rect x="430" y="566" width="30" height="40" rx="3" fill="none"/>
      <rect x="462" y="566" width="30" height="40" rx="3" fill="none"/>
    </g>
    <g stroke="#6ea8fe" stroke-width="2.5" stroke-linecap="round"><line x1="404" y1="577" x2="422" y2="595"/><line x1="422" y1="577" x2="404" y2="595"/></g>
    <circle cx="445" cy="586" r="11" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="445" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">C</text>

    <!-- D: X@3 O@1 (both swapped) -->
    <rect x="535" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <g stroke="#2a3a5e" stroke-width="1.5">
      <rect x="553" y="566" width="30" height="40" rx="3" fill="none"/>
      <rect x="585" y="566" width="30" height="40" rx="3" fill="none"/>
      <rect x="617" y="566" width="30" height="40" rx="3" fill="none"/>
    </g>
    <g stroke="#6ea8fe" stroke-width="2.5" stroke-linecap="round"><line x1="623" y1="577" x2="641" y2="595"/><line x1="641" y1="577" x2="623" y2="595"/></g>
    <circle cx="568" cy="586" r="11" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="600" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">D</text>
  </g>

  <text x="360" y="740" text-anchor="middle" font-size="14" fill="#4a5b7e">ข้อสอบไอคิว (ระดับกลาง) · Buildly Recruit</text>
</svg>
