<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" font-family="system-ui, sans-serif">
  <!-- HARD 6 — XOR / overlay matrix. Each cell has 4 slots (TL,TR,BL,BR); a filled dot = element present.
       RULE: cell3 = cell1 XOR cell2  (a slot is filled in cell3 iff it is filled in EXACTLY ONE of cell1,cell2).
       Row1: c1={TL,TR}  c2={TR,BL}          -> XOR = {TL,BL}
       Row2: c1={TL,BR}  c2={TL,TR,BR}       -> XOR = {TR}
       Row3: c1={TL,TR,BL} c2={TR,BR}        -> XOR = {TL,BL,BR} = MISSING
       Answer = dots at TL, BL, BR.  Correct = B.
       Distractors each differ by exactly ONE slot:
         A = {TL,TR,BL,BR}  (OR trap, +TR)
         C = {TL,BL}        (-BR)
         D = {BL,BR}        (-TL)
       Slot offsets from cell center: dx=+/-22, dy=+/-22. Empty slot = faint outline ring; filled = solid dot. -->
  <rect x="0" y="0" width="720" height="980" rx="18" fill="#0b1120"/>

  <!-- matrix frame -->
  <rect x="60" y="60" width="600" height="380" rx="14" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>

  <!-- column separators between c1|c2|=|c3 handled by small "op" glyphs -->

  <!-- ================= ROW 1 (cy=140) ================= -->
  <!-- c1 (cx=170): TL,TR filled ; BL,BR empty -->
  <circle cx="148" cy="118" r="8" fill="#6ea8fe"/>
  <circle cx="192" cy="118" r="8" fill="#6ea8fe"/>
  <circle cx="148" cy="162" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="192" cy="162" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <text x="262" y="149" text-anchor="middle" font-size="26" fill="#9db4d8">⊕</text>
  <!-- c2 (cx=360): TR,BL filled -->
  <circle cx="338" cy="118" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="382" cy="118" r="8" fill="#6ea8fe"/>
  <circle cx="338" cy="162" r="8" fill="#6ea8fe"/>
  <circle cx="382" cy="162" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <text x="452" y="149" text-anchor="middle" font-size="26" fill="#9db4d8">=</text>
  <!-- c3 (cx=550): XOR = TL,BL -->
  <circle cx="528" cy="118" r="8" fill="#6ea8fe"/>
  <circle cx="572" cy="118" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="528" cy="162" r="8" fill="#6ea8fe"/>
  <circle cx="572" cy="162" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>

  <line x1="80" y1="200" x2="640" y2="200" stroke="#152138" stroke-width="1.5"/>

  <!-- ================= ROW 2 (cy=260) ================= -->
  <!-- c1: TL,BR -->
  <circle cx="148" cy="238" r="8" fill="#6ea8fe"/>
  <circle cx="192" cy="238" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="148" cy="282" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="192" cy="282" r="8" fill="#6ea8fe"/>
  <text x="262" y="269" text-anchor="middle" font-size="26" fill="#9db4d8">⊕</text>
  <!-- c2: TL,TR,BR -->
  <circle cx="338" cy="238" r="8" fill="#6ea8fe"/>
  <circle cx="382" cy="238" r="8" fill="#6ea8fe"/>
  <circle cx="338" cy="282" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="382" cy="282" r="8" fill="#6ea8fe"/>
  <text x="452" y="269" text-anchor="middle" font-size="26" fill="#9db4d8">=</text>
  <!-- c3: XOR = TR -->
  <circle cx="528" cy="238" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="572" cy="238" r="8" fill="#6ea8fe"/>
  <circle cx="528" cy="282" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="572" cy="282" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>

  <line x1="80" y1="320" x2="640" y2="320" stroke="#152138" stroke-width="1.5"/>

  <!-- ================= ROW 3 (cy=380) ================= -->
  <!-- c1: TL,TR,BL -->
  <circle cx="148" cy="358" r="8" fill="#6ea8fe"/>
  <circle cx="192" cy="358" r="8" fill="#6ea8fe"/>
  <circle cx="148" cy="402" r="8" fill="#6ea8fe"/>
  <circle cx="192" cy="402" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <text x="262" y="389" text-anchor="middle" font-size="26" fill="#9db4d8">⊕</text>
  <!-- c2: TR,BR -->
  <circle cx="338" cy="358" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="382" cy="358" r="8" fill="#6ea8fe"/>
  <circle cx="338" cy="402" r="8" fill="none" stroke="#22314f" stroke-width="1.5"/>
  <circle cx="382" cy="402" r="8" fill="#6ea8fe"/>
  <text x="452" y="389" text-anchor="middle" font-size="26" fill="#9db4d8">=</text>
  <!-- c3: MISSING -->
  <rect x="506" y="336" width="88" height="88" rx="8" fill="none" stroke="#33436b" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="550" y="398" text-anchor="middle" font-size="48" font-weight="700" fill="#6ea8fe">?</text>

  <!-- prompt -->
  <text x="360" y="486" text-anchor="middle" font-size="20" fill="#9db4d8">รูปไหนควรอยู่ตรงเครื่องหมาย ?  (⊕ = อยู่ในภาพเดียวเท่านั้น)</text>

  <!-- answer choices — each box shows a 4-slot cell · Row1: A,B,C · Row2: D,E,F -->
  <g>
    <!-- A: TL,TR,BL,BR (OR trap, +TR) -->
    <g transform="translate(0,0)">
    <rect x="70" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="115" cy="570" r="9" fill="#6ea8fe"/>
    <circle cx="155" cy="570" r="9" fill="#6ea8fe"/>
    <circle cx="115" cy="610" r="9" fill="#6ea8fe"/>
    <circle cx="155" cy="610" r="9" fill="#6ea8fe"/>
    <text x="135" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">A</text>
    </g>

    <!-- B: TL,BL,BR (CORRECT) -->
    <g transform="translate(70,0)">
    <rect x="225" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="270" cy="570" r="9" fill="#6ea8fe"/>
    <circle cx="310" cy="570" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="270" cy="610" r="9" fill="#6ea8fe"/>
    <circle cx="310" cy="610" r="9" fill="#6ea8fe"/>
    <text x="290" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">B</text>
    </g>

    <!-- C: TL,BL (-BR) -->
    <g transform="translate(140,0)">
    <rect x="380" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="425" cy="570" r="9" fill="#6ea8fe"/>
    <circle cx="465" cy="570" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="425" cy="610" r="9" fill="#6ea8fe"/>
    <circle cx="465" cy="610" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <text x="445" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">C</text>
    </g>

    <!-- D: BL,BR (-TL) -->
    <g transform="translate(-465,210)">
    <rect x="535" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="580" cy="570" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="620" cy="570" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="580" cy="610" r="9" fill="#6ea8fe"/>
    <circle cx="620" cy="610" r="9" fill="#6ea8fe"/>
    <text x="600" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">D</text>
    </g>

    <!-- E: TR only (AND trap / carried single slot — not the XOR {TL,BL,BR}) -->
    <rect x="295" y="730" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="340" cy="780" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="380" cy="780" r="9" fill="#6ea8fe"/>
    <circle cx="340" cy="820" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="380" cy="820" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <text x="360" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">E</text>

    <!-- F: all empty {} (AND=none trap — not the XOR {TL,BL,BR}) -->
    <rect x="520" y="730" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="565" cy="780" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="605" cy="780" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="565" cy="820" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <circle cx="605" cy="820" r="9" fill="none" stroke="#22314f" stroke-width="1.5"/>
    <text x="585" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">F</text>
  </g>

  <text x="360" y="955" text-anchor="middle" font-size="14" fill="#4a5b7e">ตัวอย่างข้อสอบไอคิว (ระดับยาก) · Buildly Recruit</text>
</svg>
