<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" font-family="system-ui, sans-serif">
  <!-- Medium visual IQ — overlay/sum rule.
       Row 1: [circle] [cross] [circle + cross overlaid].
       Row 2: [triangle] [square] [?]  ->  triangle + square overlaid.
       Answer C. Distractors: A triangle only, B square only,
       D triangle + circle (wrong second element). -->
  <rect x="0" y="0" width="720" height="980" rx="18" fill="#0b1120"/>

  <!-- puzzle frame -->
  <rect x="70" y="60" width="580" height="380" rx="14" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>

  <defs>
    <!-- cross made of two lines -->
    <g id="cross">
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#6ea8fe" stroke-width="2.5"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#6ea8fe" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- Row 1: circle | cross | circle+cross -->
  <circle cx="180" cy="150" r="34" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <use href="#cross" x="360" y="150"/>
  <circle cx="540" cy="150" r="34" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <use href="#cross" x="540" y="150"/>

  <text x="360" y="240" text-anchor="middle" font-size="18" fill="#9db4d8">กฎ: รูปช่องที่ 3 = ช่องที่ 1 ซ้อนช่องที่ 2</text>

  <!-- Row 2: triangle | square | ? -->
  <polygon points="180,318 214,382 146,382" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="326" y="318" width="68" height="68" rx="4" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <rect x="488" y="316" width="104" height="76" rx="8" fill="none" stroke="#33436b" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="540" y="374" text-anchor="middle" font-size="48" font-weight="700" fill="#6ea8fe">?</text>

  <!-- prompt -->
  <text x="360" y="486" text-anchor="middle" font-size="20" fill="#9db4d8">รูปไหนควรอยู่ตรงเครื่องหมาย ?</text>

  <!-- answer choices -->
  <g>
    <!-- A: triangle only (near-miss: missing square) -->
    <g transform="translate(0,0)">
    <rect x="70" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <polygon points="135,558 165,612 105,612" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="135" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">A</text>
    </g>

    <!-- B: square only (near-miss: missing triangle) -->
    <g transform="translate(70,0)">
    <rect x="225" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="260" y="558" width="60" height="60" rx="4" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="290" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">B</text>
    </g>

    <!-- C: triangle + square overlaid (CORRECT) -->
    <g transform="translate(140,0)">
    <rect x="380" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="415" y="558" width="60" height="60" rx="4" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <polygon points="445,552 478,618 412,618" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="445" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">C</text>
    </g>

    <!-- D: triangle + circle (near-miss: wrong second shape) -->
    <g transform="translate(-465,210)">
    <rect x="535" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="600" cy="588" r="32" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <polygon points="600,556 632,616 568,616" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="600" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">D</text>
    </g>

    <!-- E: square + circle (WRONG: missing triangle, wrong element) -->
    <rect x="295" y="730" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="330" y="765" width="60" height="60" rx="4" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <circle cx="360" cy="795" r="32" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="360" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">E</text>

    <!-- F: triangle + square + circle (WRONG: extra third shape) -->
    <rect x="520" y="730" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="555" y="765" width="60" height="60" rx="4" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <polygon points="585,762 618,828 552,828" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="585" cy="795" r="20" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="585" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">F</text>
  </g>

  <text x="360" y="955" text-anchor="middle" font-size="14" fill="#4a5b7e">ตัวอย่างข้อสอบไอคิว (ระดับกลาง) · Buildly Recruit</text>
</svg>
