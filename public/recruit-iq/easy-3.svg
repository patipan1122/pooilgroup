<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" font-family="system-ui, sans-serif">
  <!-- Easy 3 — Odd one out. 4 answer boxes, each holds one figure:
       A square / B square / C triangle / D square. The triangle is the odd one.
       CORRECT = C (triangle). -->
  <rect x="0" y="0" width="720" height="980" rx="18" fill="#0b1120"/>

  <!-- top puzzle frame with the 4 figures shown together -->
  <rect x="40" y="60" width="640" height="330" rx="14" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>

  <text x="360" y="110" text-anchor="middle" font-size="18" fill="#9db4d8">มีรูปหนึ่งที่ต่างจากพวก</text>

  <!-- Figure 1: square -->
  <rect x="92" y="200" width="90" height="90" rx="6" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <text x="137" y="330" text-anchor="middle" font-size="18" fill="#9db4d8">A</text>

  <!-- Figure 2: square -->
  <rect x="255" y="200" width="90" height="90" rx="6" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <text x="300" y="330" text-anchor="middle" font-size="18" fill="#9db4d8">B</text>

  <!-- Figure 3: triangle (ODD) -->
  <polygon points="463,200 508,290 418,290" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="463" y="330" text-anchor="middle" font-size="18" fill="#9db4d8">C</text>

  <!-- Figure 4: square -->
  <rect x="581" y="200" width="90" height="90" rx="6" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <text x="626" y="330" text-anchor="middle" font-size="18" fill="#9db4d8">D</text>

  <!-- prompt -->
  <text x="360" y="450" text-anchor="middle" font-size="20" fill="#9db4d8">รูปไหนที่แตกต่างจากรูปอื่น ?</text>

  <!-- answer choices -->
  <g>
    <!-- A: square -->
    <g transform="translate(0,0)">
    <rect x="70" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="102" y="555" width="66" height="66" rx="5" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="135" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">A</text>
    </g>

    <!-- B: square -->
    <g transform="translate(70,0)">
    <rect x="225" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="257" y="555" width="66" height="66" rx="5" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="290" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">B</text>
    </g>

    <!-- C: triangle (CORRECT) -->
    <g transform="translate(140,0)">
    <rect x="380" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <polygon points="445,552 481,622 409,622" fill="none" stroke="#6ea8fe" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="445" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">C</text>
    </g>

    <!-- D: square -> row 2 col 1 -->
    <g transform="translate(-465,210)">
    <rect x="535" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="567" y="555" width="66" height="66" rx="5" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="600" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">D</text>
    </g>

    <!-- E: square (MAJORITY group - NOT the odd one, so still WRONG) -->
    <rect x="295" y="730" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="327" y="762" width="66" height="66" rx="5" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="360" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">E</text>

    <!-- F: square (MAJORITY group - NOT the odd one, so still WRONG) -->
    <rect x="520" y="730" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="552" y="762" width="66" height="66" rx="5" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="585" y="865" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">F</text>
  </g>

  <text x="360" y="955" text-anchor="middle" font-size="14" fill="#4a5b7e">ข้อสอบไอคิว (ระดับง่าย) · Buildly Recruit</text>
</svg>
