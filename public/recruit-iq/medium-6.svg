<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" font-family="system-ui, sans-serif">
  <!-- Medium visual IQ — Series with TWO transforms at once.
       Stream 1: the square rotates +45 deg each step (0,45,90,135 -> next 180).
                 A 180-deg square looks axis-aligned (like 0 deg).
       Stream 2: a dot travels clockwise around the square, one side per step:
                 top -> right -> bottom -> left -> next = top.
       So the 5th figure = axis-aligned square with the dot on TOP.
       Answer B.
       Distractors (each wrong on exactly one stream):
         A = diamond (45 deg) + dot top   -> rotation wrong
         C = square + dot on right         -> dot position wrong
         D = square + dot on bottom        -> dot position wrong -->
  <rect x="0" y="0" width="720" height="780" rx="18" fill="#0b1120"/>

  <!-- puzzle frame -->
  <rect x="70" y="60" width="580" height="380" rx="14" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>

  <defs>
    <!-- unit square centered at origin, half-side 30 -->
    <rect id="sq6" x="-30" y="-30" width="60" height="60" rx="3" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <circle id="dot6" r="7" fill="#6ea8fe"/>
  </defs>

  <!-- Figure 1: 0 deg, dot top -->
  <use href="#sq6" transform="translate(170,150) rotate(0)"/>
  <use href="#dot6" x="170" y="105"/>

  <!-- Figure 2: 45 deg, dot right -->
  <use href="#sq6" transform="translate(320,150) rotate(45)"/>
  <use href="#dot6" x="368" y="150"/>

  <!-- Figure 3: 90 deg (looks like square), dot bottom -->
  <use href="#sq6" transform="translate(470,150) rotate(90)"/>
  <use href="#dot6" x="470" y="198"/>

  <!-- Figure 4: 135 deg (diamond), dot left -->
  <use href="#sq6" transform="translate(590,150) rotate(135)"/>
  <use href="#dot6" x="542" y="150"/>

  <text x="360" y="260" text-anchor="middle" font-size="18" fill="#9db4d8">สี่เหลี่ยมหมุน +45° ทุกช่อง · จุดวิ่งตามเข็มรอบรูป ทีละด้าน</text>
  <text x="360" y="300" text-anchor="middle" font-size="18" fill="#9db4d8">บน → ขวา → ล่าง → ซ้าย → ?</text>

  <!-- fifth = ? -->
  <rect x="308" y="330" width="104" height="90" rx="8" fill="none" stroke="#33436b" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="360" y="392" text-anchor="middle" font-size="48" font-weight="700" fill="#6ea8fe">?</text>

  <!-- prompt -->
  <text x="360" y="486" text-anchor="middle" font-size="20" fill="#9db4d8">รูปที่ 5 ควรเป็นแบบใด?</text>

  <!-- answer choices -->
  <g>
    <!-- A: 45 deg diamond + dot top (near-miss: rotation wrong) -->
    <rect x="70" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <use href="#sq6" transform="translate(135,590) rotate(45)"/>
    <use href="#dot6" x="135" y="547"/>
    <text x="135" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">A</text>

    <!-- B: axis-aligned square + dot top (CORRECT) -->
    <rect x="225" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <use href="#sq6" transform="translate(290,590) rotate(0)"/>
    <use href="#dot6" x="290" y="547"/>
    <text x="290" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">B</text>

    <!-- C: square + dot right (near-miss: dot position wrong) -->
    <rect x="380" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <use href="#sq6" transform="translate(445,590) rotate(0)"/>
    <use href="#dot6" x="493" y="590"/>
    <text x="445" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">C</text>

    <!-- D: square + dot bottom (near-miss: dot position wrong) -->
    <rect x="535" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <use href="#sq6" transform="translate(600,590) rotate(0)"/>
    <use href="#dot6" x="600" y="633"/>
    <text x="600" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">D</text>
  </g>

  <text x="360" y="740" text-anchor="middle" font-size="14" fill="#4a5b7e">ตัวอย่างข้อสอบไอคิว (ระดับกลาง) · Buildly Recruit</text>
</svg>
