<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" font-family="system-ui, sans-serif">
  <!-- b2-easy-3 — NESTED SHAPE GROWS. Each cell = an outer square holding an inner circle.
       Outer square stays the same size; inner circle grows small -> medium -> large.
       CORRECT = A (square + large inner circle).
       Distractors: B square + medium circle (too small), C circle outer + large circle (wrong outer),
       D empty square (no inner shape). -->
  <rect x="0" y="0" width="720" height="780" rx="18" fill="#0b1120"/>

  <!-- series frame -->
  <rect x="70" y="60" width="580" height="380" rx="14" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>

  <!-- three shown cells + one missing, centers x = 175 / 315 / 455 / 585 ; cy 240 -->
  <!-- Outer square: 110x110 constant. Inner circle radius grows: 14 -> 28 -> 42. -->

  <!-- Cell 1: small inner circle r14 -->
  <rect x="120" y="185" width="110" height="110" rx="10" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <circle cx="175" cy="240" r="14" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>

  <!-- Cell 2: medium inner circle r28 -->
  <rect x="260" y="185" width="110" height="110" rx="10" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <circle cx="315" cy="240" r="28" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>

  <!-- Cell 3: large inner circle r42 -->
  <rect x="400" y="185" width="110" height="110" rx="10" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <circle cx="455" cy="240" r="42" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>

  <!-- Cell 4: MISSING -->
  <rect x="530" y="185" width="110" height="110" rx="10" fill="none" stroke="#33436b" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="585" y="260" text-anchor="middle" font-size="52" font-weight="700" fill="#6ea8fe">?</text>

  <!-- prompt -->
  <text x="360" y="486" text-anchor="middle" font-size="20" fill="#9db4d8">รูปไหนควรอยู่ตรงเครื่องหมาย ?</text>

  <!-- answer choices : outer 84x84, centered per box. Box centers x = 135 / 290 / 445 / 600 ; cy 585 -->
  <g>
    <!-- A: square + large inner circle r34 (CORRECT) -->
    <rect x="70" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="93" y="543" width="84" height="84" rx="8" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <circle cx="135" cy="585" r="34" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="135" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">A</text>

    <!-- B: square + medium inner circle r20 (wrong size) -->
    <rect x="225" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="248" y="543" width="84" height="84" rx="8" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <circle cx="290" cy="585" r="20" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="290" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">B</text>

    <!-- C: circle outer + large inner circle (wrong outer shape) -->
    <rect x="380" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <circle cx="445" cy="585" r="43" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <circle cx="445" cy="585" r="34" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="445" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">C</text>

    <!-- D: empty square (no inner shape) -->
    <rect x="535" y="520" width="130" height="150" rx="12" fill="#0e1730" stroke="#1e2b48" stroke-width="1.5"/>
    <rect x="558" y="543" width="84" height="84" rx="8" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
    <text x="600" y="655" text-anchor="middle" font-size="22" font-weight="700" fill="#9db4d8">D</text>
  </g>

  <text x="360" y="740" text-anchor="middle" font-size="14" fill="#4a5b7e">ข้อสอบไอคิว (ระดับง่าย) · Buildly Recruit</text>
</svg>
