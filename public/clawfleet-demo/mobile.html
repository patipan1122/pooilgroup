<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>ClawFleet · แอปพนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&family=Mitr:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<style>
  html,body{height:100%;background:var(--cream);}
  #app{max-width:440px;margin:0 auto;min-height:100%;background:var(--cream);position:relative;display:flex;flex-direction:column;}
  .m-top{position:sticky;top:0;z-index:20;background:var(--cream);padding:16px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--cream-deep);}
  .m-back{width:40px;height:40px;border-radius:13px;background:var(--white);box-shadow:var(--sh-sm);display:grid;place-items:center;font-size:22px;color:var(--ink);}
  .m-title{font-family:var(--f-th);font-weight:600;font-size:18px;line-height:1.15;}
  .m-sub{font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--ink-faint);}
  .m-body{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
  .m-foot{position:sticky;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--cream) 26%);}
  .label{font-family:var(--f-body);font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);}
  .field label{display:block;font-family:var(--f-th);font-weight:500;font-size:14px;color:var(--ink-soft);margin-bottom:6px;}
  .field input{width:100%;padding:14px 16px;border-radius:14px;background:var(--white);border:2px solid var(--cream-deep);
    font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;outline:none;}
  .field input:focus{border-color:var(--mustard);}
  .hint{font-family:var(--f-body);font-weight:700;font-size:13px;color:var(--ink-faint);margin-top:6px;}
  .ref{background:var(--cream-deep);border-radius:16px;padding:14px 16px;}
  .ref.violet{background:var(--cream-deep);}
  .ref-l{font-family:var(--f-body);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  .ref.violet .ref-l{color:var(--ink-soft);}
  .ref-v{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--ink);line-height:1.05;}
  .ref.violet .ref-v{color:var(--ink);}
  .cam{background:var(--ink);border-radius:18px;padding:22px;text-align:center;color:#fff;}
  .cam.done{background:var(--green-tint);color:var(--green);}
  .cam .ct{font-family:var(--f-th);font-weight:600;font-size:17px;margin-top:6px;}
  .cam .cs{font-family:var(--f-body);font-weight:600;font-size:12px;opacity:.7;margin-top:2px;}
  .counter{display:flex;align-items:center;gap:14px;background:var(--white);border:2px solid var(--cream-deep);border-radius:16px;padding:8px;}
  .counter button{width:48px;height:48px;border-radius:12px;background:var(--cream);font-size:24px;font-weight:700;color:var(--ink);display:grid;place-items:center;}
  .counter .cval{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:30px;}
  .mrow{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:18px;padding:15px 16px;box-shadow:var(--sh-sm);text-align:left;width:100%;}
  .mrow .mnum{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;flex-shrink:0;}
  .mrow .mname{font-family:var(--f-th);font-weight:600;font-size:16px;}
  .mrow .mmeta{font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--ink-faint);}
  .prog{height:8px;background:var(--cream-deep);border-radius:99px;overflow:hidden;}
  .prog>div{height:100%;background:var(--mustard);border-radius:99px;transition:width .3s;}
  .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .pslot{aspect-ratio:1.5;border-radius:13px;border:2px dashed var(--cream-line);display:grid;place-items:center;gap:4px;
    font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--ink-faint);}
  .pslot.done{border:none;color:#fff;}
  .sku-row{display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:14px;padding:10px 12px;box-shadow:var(--sh-sm);}
  .mini-counter{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:10px;padding:4px;}
  .mini-counter button{width:30px;height:30px;border-radius:8px;background:var(--white);font-size:17px;font-weight:700;}
  .mini-counter span{min-width:26px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px;}
  .check-card{background:var(--white);border-radius:18px;padding:16px;box-shadow:var(--sh-sm);}
  .ck{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-family:var(--f-body);font-weight:700;font-size:15px;}
  .ck b{font-family:var(--f-display);font-variant-numeric:tabular-nums;}
  .ck.gap{border-top:2px dashed var(--cream-deep);margin-top:6px;padding-top:12px;}
  .alert{display:flex;gap:10px;background:var(--red-tint);border-radius:16px;padding:14px;color:var(--red);}
  .alert.ok{background:var(--green-tint);color:var(--green);}
  .fade{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;}}
</style>
</head>
<body>
<div id="app"></div>

<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./vendor/babel.js"></script>
<script src="data.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const CF = window.CF;
const toneColor = { mustard:'var(--ink-soft)', blue:'var(--ink-soft)', red:'var(--ink-soft)', green:'var(--ink-soft)', violet:'var(--ink-soft)' };

function Cam({ label, sub, done, onShoot }) {
  return (
    <button className={`cam ${done?'done':''}`} onClick={onShoot} style={{width:'100%'}}>
      <div style={{fontSize:28}}>{done ? '✓' : '📷'}</div>
      <div className="ct">{done ? 'ถ่ายแล้ว' : label}</div>
      {sub && !done && <div className="cs">{sub}</div>}
    </button>
  );
}
function Counter({ value, set, min=0 }) {
  return (
    <div className="counter">
      <button onClick={()=>set(Math.max(min, value-1))}>−</button>
      <div className="cval mono">{value}</div>
      <button onClick={()=>set(value+1)}>+</button>
    </div>
  );
}

// ---------- HOME: pick branch ----------
function Home({ staff, onPick, onLogout, onHistory, onBroken }) {
  const myBranches = CF.BRANCHES.filter(b => staff.branches.includes(b.id));
  const sessions = myBranches.map(b => ({ b, s: CF.getSession(b.id) }));
  return (
    <>
      <div className="m-top">
        <div className="mascot" style={{width:40,height:40,background:toneColor[staff.tone],fontSize:15}}>{staff.avatar}</div>
        <div style={{flex:1}}>
          <div className="m-title">สวัสดี, {staff.name} 👋</div>
          <div className="m-sub">เลือกสาขาที่จะเก็บเงินวันนี้</div>
        </div>
        <button className="m-back" onClick={onLogout} title="ออกจากระบบ">⏻</button>
      </div>
      <div className="m-body">
        <div className="label">สาขาของฉัน</div>
        {sessions.map(({b,s}) => {
          const done = s ? Object.keys(s.entries||{}).length : 0;
          return (
            <button key={b.id} className="card fade" style={{textAlign:'left',display:'flex',alignItems:'center',gap:14,padding:16}} onClick={()=>onPick(b.id)}>
              <div className="mascot" style={{width:48,height:48,background:toneColor[b.tone],fontSize:20}}>{b.avatar}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:18}}>{b.name}</div>
                <div className="fb" style={{fontWeight:700,fontSize:13,color:'var(--ink-faint)'}}>{b.area} · 6 ตู้ · {b.code}</div>
              </div>
              {s ? <span className="pill pill-mustard">{done}/6</span> : <span style={{fontSize:24,color:'var(--mustard)'}}>→</span>}
            </button>
          );
        })}
        <div style={{display:'flex',gap:12,marginTop:6}}>
          <button className="card fade" style={{flex:1,padding:18,textAlign:'center'}} onClick={onHistory}>
            <div style={{fontSize:26}}>📜</div>
            <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:15,marginTop:4}}>ประวัติรอบ</div>
          </button>
          <button className="card fade" style={{flex:1,padding:18,textAlign:'center'}} onClick={onBroken}>
            <div style={{fontSize:26}}>🔧</div>
            <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:15,marginTop:4}}>แจ้งตู้เสีย</div>
          </button>
        </div>
      </div>
    </>
  );
}

// ---------- LOGIN ----------
function Login({ onLogin }) {
  const [picked, setPicked] = useState(null);
  const [pin, setPin] = useState('');
  const staff = CF.STAFF.find(s=>s.id===picked);
  const submit = () => {
    if (staff && pin === staff.pin) onLogin(staff);
    else if (staff && pin.length>=4) { setPin(''); alert('PIN ไม่ถูกต้อง (ลองใช้ '+staff.pin+')'); }
  };
  return (
    <>
      <div className="m-top">
        <div className="mascot" style={{width:40,height:40,background:'var(--mustard)',fontSize:13}}>CF</div>
        <div style={{flex:1}}>
          <div className="m-title">ClawFleet · เข้าสู่ระบบ</div>
          <div className="m-sub">เลือกชื่อแล้วใส่ PIN</div>
        </div>
      </div>
      <div className="m-body">
        {!picked ? <>
          <div className="label">เลือกพนักงาน</div>
          {CF.STAFF.map(s=>(
            <button key={s.id} className="card fade" style={{textAlign:'left',display:'flex',alignItems:'center',gap:14,padding:16}} onClick={()=>setPicked(s.id)}>
              <div className="mascot" style={{width:46,height:46,background:toneColor[s.tone],fontSize:18}}>{s.avatar}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:18}}>{s.name}</div>
                <div className="fb" style={{fontWeight:700,fontSize:13,color:'var(--ink-faint)'}}>{s.branches.length} สาขา · ผ่าน {s.rounds} รอบ</div>
              </div>
              <span style={{fontSize:22,color:'var(--mustard)'}}>→</span>
            </button>
          ))}
        </> : <div className="fade" style={{display:'flex',flexDirection:'column',gap:16,alignItems:'center'}}>
          <div className="mascot" style={{width:80,height:80,background:toneColor[staff.tone],fontSize:32,marginTop:10}}>{staff.avatar}</div>
          <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:22}}>{staff.name}</div>
          <div style={{display:'flex',gap:10}}>
            {[0,1,2,3].map(i=><div key={i} style={{width:18,height:18,borderRadius:'50%',background: i<pin.length?'var(--mustard)':'var(--cream-deep)'}}/>)}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,width:260}}>
            {[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>(
              <button key={k} className="card" style={{padding:'18px 0',fontFamily:'var(--f-display)',fontWeight:700,fontSize:24,textAlign:'center'}}
                onClick={()=>{ if(k==='⌫') setPin(p=>p.slice(0,-1)); else if(k==='✓') submit(); else if(pin.length<4) setPin(p=>p+k); }}>{k}</button>
            ))}
          </div>
          <button className="btn btn-soft" onClick={()=>{setPicked(null);setPin('');}}>← เปลี่ยนคน</button>
          <div className="fb t-faint" style={{fontWeight:700,fontSize:12}}>PIN ตัวอย่าง: {staff.pin}</div>
        </div>}
      </div>
    </>
  );
}

// ---------- HISTORY ----------
function History({ staff, onBack }) {
  const rows = CF.INSIGHTS.filter(r=>r.staff===staff.name);
  return (
    <>
      <div className="m-top">
        <button className="m-back" onClick={onBack}>←</button>
        <div style={{flex:1}}><div className="m-title">ประวัติรอบของฉัน</div><div className="m-sub">{staff.name} · {rows.length} รอบล่าสุด</div></div>
      </div>
      <div className="m-body">
        {rows.length===0 && <div className="card" style={{textAlign:'center',color:'var(--ink-faint)'}}>ยังไม่มีรอบที่บันทึก</div>}
        {rows.map((r,i)=>{ const b=CF.branchById(r.bid); return (
          <div key={i} className="card fade" style={{display:'flex',alignItems:'center',gap:14,padding:16}}>
            <div className="mascot" style={{width:42,height:42,background:toneColor[b.tone],fontSize:16}}>{b.avatar}</div>
            <div style={{flex:1}}>
              <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:16}}>{b.name}</div>
              <div className="fb" style={{fontWeight:700,fontSize:12,color:'var(--ink-faint)'}}>{r.time} · {r.id}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div className="fd" style={{fontWeight:700,fontSize:17}}>{CF.fmt(r.actual)}</div>
              {r.status==='review'
                ? <span className="pill pill-red" style={{fontSize:11}}>ตรวจอยู่</span>
                : <span className="pill pill-green" style={{fontSize:11}}>ผ่าน</span>}
            </div>
          </div>
        );})}
      </div>
    </>
  );
}

// ---------- REPORT BROKEN ----------
function ReportBroken({ staff, onBack }) {
  const myBranches = CF.BRANCHES.filter(b=>staff.branches.includes(b.id));
  const [bid, setBid] = useState(myBranches[0]?.id);
  const [code, setCode] = useState('');
  const [issue, setIssue] = useState('');
  const [photo, setPhoto] = useState(false);
  const [sent, setSent] = useState(false);
  const issues = ['มิเตอร์ไม่ขึ้น','คีบไม่ติด','จอเสีย','เครื่องค้าง','อื่น ๆ'];
  const machines = bid ? CF.machinesFor(bid) : [];
  if (sent) return (
    <div className="m-body" style={{justifyContent:'center',alignItems:'center',textAlign:'center',gap:18}}>
      <div className="mascot" style={{width:110,height:110,background:'var(--green)',fontSize:50}}>✓</div>
      <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:24}}>แจ้งเรียบร้อย!</div>
      <div className="fb" style={{fontWeight:700,fontSize:15,color:'var(--ink-soft)',maxWidth:280}}>ส่งให้เจ้าของแล้ว · จะเห็นใน Audit log</div>
      <button className="btn btn-primary btn-lg" onClick={onBack}>กลับหน้าแรก</button>
    </div>
  );
  return (
    <>
      <div className="m-top">
        <button className="m-back" onClick={onBack}>←</button>
        <div style={{flex:1}}><div className="m-title">แจ้งตู้เสีย</div><div className="m-sub">ส่งให้เจ้าของทันที</div></div>
      </div>
      <div className="m-body">
        <div className="field"><label>สาขา</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>{myBranches.map(b=>(
            <button key={b.id} className={`pill ${bid===b.id?'pill-solid-mustard':''}`} style={{padding:'9px 14px',fontSize:14}} onClick={()=>{setBid(b.id);setCode('');}}>{b.name}</button>
          ))}</div>
        </div>
        <div className="field"><label>ตู้ไหน</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>{machines.map(m=>(
            <button key={m.code} className={`pill ${code===m.code?'pill-solid-mustard':''}`} style={{padding:'9px 14px',fontSize:14}} onClick={()=>setCode(m.code)}>{m.name.split('·')[0]}</button>
          ))}</div>
        </div>
        <div className="field"><label>อาการ</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>{issues.map(x=>(
            <button key={x} className={`pill ${issue===x?'pill-solid-red':''}`} style={{padding:'9px 14px',fontSize:14}} onClick={()=>setIssue(x)}>{x}</button>
          ))}</div>
        </div>
        <Cam label="ถ่ายรูปอาการ (ถ้ามี)" done={photo} onShoot={()=>setPhoto(true)}/>
      </div>
      <div className="m-foot">
        <button className="btn btn-primary btn-lg btn-block" disabled={!code||!issue} onClick={()=>{
          CF.addBroken({ time:'วันนี้', bid, code, issue, staff:staff.name }); setSent(true);
        }}>ส่งแจ้งเตือน</button>
      </div>
    </>
  );
}

// ---------- SESSION: machine checklist ----------
function Session({ bid, onBack, onMachine }) {
  const b = CF.branchById(bid);
  const machines = CF.machinesFor(bid);
  const sess = CF.getSession(bid) || { entries:{} };
  const entries = sess.entries || {};
  const doneCount = Object.keys(entries).length;
  const allDone = doneCount === machines.length;

  return (
    <>
      <div className="m-top">
        <button className="m-back" onClick={onBack}>←</button>
        <div style={{flex:1}}>
          <div className="m-title">{b.name}</div>
          <div className="m-sub">{b.area} · เก็บเงินรอบวันนี้</div>
        </div>
        <span className="pill pill-mustard">{doneCount}/6</span>
      </div>
      <div className="m-body">
        <div className="card" style={{padding:16}}>
          <div className="prog"><div style={{width:`${doneCount/6*100}%`}}/></div>
          <div className="fb" style={{fontWeight:700,fontSize:13,color:'var(--ink-soft)',marginTop:8}}>
            เก็บแล้ว {doneCount} ตู้ · เหลือ {6-doneCount} ตู้
          </div>
        </div>
        {machines.map((m,i) => {
          const e = entries[m.code];
          let status = null, flag=false;
          if (e) { const c = CF.computeMachine(m,e); status = CF.machineStatus(c); flag = status==='flag'; }
          return (
            <button key={m.code} className="mrow fade" onClick={()=>onMachine(m.code)}>
              <div className="mnum" style={{background: e ? (flag?'var(--red-tint)':'var(--green-tint)') : 'var(--cream)', color: e ? (flag?'var(--red)':'var(--green)') : 'var(--ink-faint)'}}>
                {e ? (flag?'⚑':'✓') : i+1}
              </div>
              <div style={{flex:1}}>
                <div className="mname">{m.name}</div>
                <div className="mmeta">{e ? (flag?'พบส่วนต่าง · แตะดู':'เก็บแล้ว'):'ยังไม่เก็บ'}</div>
              </div>
              <span style={{fontSize:22,color:'var(--ink-faint)'}}>›</span>
            </button>
          );
        })}
      </div>
      <div className="m-foot">
        <button className="btn btn-primary btn-lg btn-block" disabled={!allDone} onClick={()=>onMachine('__close__')}>
          {allDone ? 'ปิดรอบ · ตรวจสอบทั้งสาขา →' : `เก็บให้ครบก่อน (เหลือ ${6-doneCount})`}
        </button>
      </div>
    </>
  );
}

// ---------- MACHINE: 3 sub-steps ----------
function Machine({ bid, code, onBack, onSaved }) {
  const machines = CF.machinesFor(bid);
  const m = machines.find(x=>x.code===code);
  const existing = (CF.getSession(bid)||{entries:{}}).entries[code];
  const [step, setStep] = useState(0);
  const [prizeCountNow, setPrizeCountNow] = useState(existing?.prizeCountNow ?? m.prizePrev);
  const [coinMeterNow, setCoinMeterNow] = useState(existing?.coinMeterNow ?? (m.coinMeterPrev + 108));
  const [prizeMeterNow, setPrizeMeterNow] = useState(existing?.prizeMeterNow ?? (m.prizeMeterPrev + (m.prizePrev - (existing?.prizeCountNow ?? m.prizePrev))));
  const [cashIn, setCashIn] = useState(existing?.cashIn ?? '');
  const [refills, setRefills] = useState(existing?.refills ?? {});
  const [photos, setPhotos] = useState(existing?.photos ?? {});
  const shoot = k => setPhotos(p=>({...p,[k]:true}));
  const stock = CF.STOCK[bid] || {};

  const e = { prizeCountNow, coinMeterNow:+coinMeterNow||0, prizeMeterNow:+prizeMeterNow||0, cashIn:+cashIn||0, refills, photos };
  const c = CF.computeMachine(m, e);
  const titles = ['นับตุ๊กตา ก่อนเติม','ถ่ายมิเตอร์ + เก็บเงิน','เติมตุ๊กตา'];

  function save() {
    const sess = CF.getSession(bid) || { startedAt: Date.now(), entries:{} };
    sess.entries[code] = e;
    CF.setSession(bid, sess);
    onSaved();
  }

  return (
    <>
      <div className="m-top">
        <button className="m-back" onClick={step===0?onBack:()=>setStep(step-1)}>←</button>
        <div style={{flex:1}}>
          <div className="m-title">{m.name}</div>
          <div className="m-sub">ขั้น {step+1}/3 · {titles[step]}</div>
        </div>
      </div>
      <div className="m-body" key={step}>
        <div className="prog"><div style={{width:`${(step+1)/3*100}%`}}/></div>

        {step===0 && <div className="fade" style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="ref violet">
            <div className="ref-l">ตุ๊กต ารอบก่อน · จากระบบ</div>
            <div className="ref-v mono">{m.prizePrev} ตัว</div>
          </div>
          <Cam label="ถ่ายตุ๊กตาในตู้ ก่อนเติม" sub="ให้เห็นตุ๊กตาชัดเจน" done={photos.prizeBefore} onShoot={()=>shoot('prizeBefore')}/>
          <div className="field">
            <label>นับตุ๊กตาในตู้ตอนนี้ (ก่อนเติม)</label>
            <Counter value={prizeCountNow} set={setPrizeCountNow}/>
            <div className="hint">ก่อนเก็บ {m.prizePrev} → ตอนนี้ {prizeCountNow} · ลูกค้าคีบไป <b className="t-red">{Math.max(0,m.prizePrev-prizeCountNow)} ตัว</b></div>
          </div>
        </div>}

        {step===1 && <div className="fade" style={{display:'flex',flexDirection:'column',gap:14}}>
          <div style={{display:'flex',gap:10}}>
            <div className="ref" style={{flex:1}}>
              <div className="ref-l">มิเตอร์เหรียญ ก่อน</div>
              <div className="ref-v mono">{m.coinMeterPrev.toLocaleString()}</div>
            </div>
            <div className="ref violet" style={{flex:1}}>
              <div className="ref-l">มิเตอร์ตุ๊กตา ก่อน</div>
              <div className="ref-v mono">{m.prizeMeterPrev.toLocaleString()}</div>
            </div>
          </div>
          <Cam label="ถ่ายมิเตอร์ทั้ง 2 ตัว" sub="OCR จะอ่านเลขให้" done={photos.meter} onShoot={()=>shoot('meter')}/>
          <div className="field">
            <label>มิเตอร์เหรียญวันนี้ <span className="t-faint">(OCR อ่าน · แก้ได้)</span></label>
            <input type="number" inputMode="numeric" value={coinMeterNow} onChange={ev=>setCoinMeterNow(ev.target.value)}/>
            <div className="hint">+{c.coinDelta} ครั้ง × ฿{CF.COIN_RATE} = ควรมีเงิน <b className="t-green">{CF.fmt(c.expectedCash)}</b></div>
          </div>
          <div className="field">
            <label>มิเตอร์ตุ๊กตาวันนี้ <span className="t-faint">(OCR อ่าน)</span></label>
            <input type="number" inputMode="numeric" value={prizeMeterNow} onChange={ev=>setPrizeMeterNow(ev.target.value)}/>
            <div className="hint">ตู้แจกตุ๊กตา <b className="t-soft">{c.prizeMeterDelta} ตัว</b> ตามมิเตอร์</div>
          </div>
          <Cam label="ถ่ายเงินในถาด" done={photos.cash} onShoot={()=>shoot('cash')}/>
          <div className="field">
            <label>เงินสดในถาด (นับจริง)</label>
            <input type="number" inputMode="numeric" placeholder="0" value={cashIn} onChange={ev=>setCashIn(ev.target.value)}/>
            <div className="hint" style={{color: Math.abs(c.cashGap)<=c.expectedCash*0.05?'var(--green)':'var(--red)'}}>
              {cashIn==='' ? 'ใส่ยอดเงินที่นับได้' : (c.cashGap===0?'✓ ตรงกับมิเตอร์พอดี':`ส่วนต่าง ${c.cashGap>0?'+':''}${CF.fmt(c.cashGap)} (${c.cashPct.toFixed(0)}%)`)}
            </div>
          </div>
        </div>}

        {step===2 && <div className="fade" style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="alert" style={{background: c.prizeGap>1?'var(--red-tint)':'var(--green-tint)', color: c.prizeGap>1?'var(--red)':'var(--green)'}}>
            <div style={{fontSize:20}}>{c.prizeGap>1?'⚑':'✓'}</div>
            <div className="fb" style={{fontWeight:700,fontSize:14}}>
              มิเตอร์ตุ๊กตาบอกแจก {c.prizeMeterDelta} · นับหายจริง {c.physicalOut}
              {c.prizeGap>1 ? ` · ต่าง ${c.prizeGap} ตัวหายไปไหน?` : ' · ตรงกัน'}
            </div>
          </div>
          <div className="label">เติมจากคลังสาขา</div>
          {CF.SKUS.map(s => {
            const have = stock[s.code]||0;
            const q = refills[s.code]||0;
            return (
              <div key={s.code} className="sku-row">
                <div>
                  <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:15}}>{s.name}</div>
                  <div className="fb" style={{fontWeight:700,fontSize:12,color: have<=3?'var(--red)':'var(--ink-faint)'}}>คลังเหลือ {have} ตัว</div>
                </div>
                <div className="mini-counter">
                  <button onClick={()=>setRefills(r=>({...r,[s.code]:Math.max(0,(r[s.code]||0)-1)}))}>−</button>
                  <span className="mono">{q}</span>
                  <button onClick={()=>setRefills(r=>({...r,[s.code]:Math.min(have,(r[s.code]||0)+1)}))}>+</button>
                </div>
              </div>
            );
          })}
          <Cam label="ถ่ายตุ๊กตาในตู้ หลังเติม" sub={`${prizeCountNow} + ${c.refillTotal} = ${c.afterCount} ตัว`} done={photos.prizeAfter} onShoot={()=>shoot('prizeAfter')}/>
        </div>}
      </div>

      <div className="m-foot">
        {step<2
          ? <button className="btn btn-primary btn-lg btn-block"
              disabled={step===0 ? !photos.prizeBefore : (!photos.meter||!photos.cash||cashIn==='')}
              onClick={()=>setStep(step+1)}>
              {step===0?'ต่อไป · ถ่ายมิเตอร์ + เก็บเงิน →':'ต่อไป · เติมตุ๊กตา →'}
            </button>
          : <button className="btn btn-primary btn-lg btn-block" disabled={!photos.prizeAfter} onClick={save}>
              บันทึกตู้นี้ ✓
            </button>}
      </div>
    </>
  );
}

// ---------- CLOSE: aggregate cross-check ----------
function Close({ bid, onBack, onDone }) {
  const machines = CF.machinesFor(bid);
  const sess = CF.getSession(bid) || {entries:{}};
  const rows = machines.map(m => ({ m, c: CF.computeMachine(m, sess.entries[m.code]) }));
  const sum = rows.reduce((a,{c})=>({
    expected:a.expected+c.expectedCash, cash:a.cash+ (sess.entries && c ? c.expectedCash+c.cashGap : 0),
    meterPrize:a.meterPrize+c.prizeMeterDelta, physical:a.physical+c.physicalOut,
  }), {expected:0,cash:0,meterPrize:0,physical:0});
  const cashGap = sum.cash - sum.expected;
  const cashPct = sum.expected? Math.abs(cashGap)/sum.expected*100 : 0;
  const prizeGap = sum.meterPrize - sum.physical;
  const flagged = rows.filter(({c})=>CF.machineStatus(c)==='flag');
  const willFlag = cashPct>5 || Math.abs(prizeGap)>1;

  return (
    <>
      <div className="m-top">
        <button className="m-back" onClick={onBack}>←</button>
        <div style={{flex:1}}><div className="m-title">ปิดรอบ · ตรวจสอบ</div><div className="m-sub">{CF.branchById(bid).name} · 6 ตู้</div></div>
      </div>
      <div className="m-body">
        <div className="label">Cross-check: เงิน</div>
        <div className="check-card">
          <div className="ck"><span className="t-soft">มิเตอร์เหรียญ รวม 6 ตู้</span><b>{CF.fmt(sum.expected)}</b></div>
          <div className="ck"><span className="t-soft">เงินสดในถาด รวม</span><b>{CF.fmt(sum.cash)}</b></div>
          <div className="ck gap"><span style={{fontWeight:800}}>ส่วนต่าง</span><b className={cashGap===0?'t-green':'t-red'} style={{fontSize:22}}>{cashGap>0?'+':''}{CF.fmt(cashGap)}</b></div>
        </div>
        <div className="label">Cross-check: ตุ๊กตา</div>
        <div className="check-card">
          <div className="ck"><span className="t-soft">มิเตอร์ตุ๊กตา บอกตู้แจก</span><b>{sum.meterPrize} ตัว</b></div>
          <div className="ck"><span className="t-soft">นับตุ๊กตาหายจริง รวม</span><b>{sum.physical} ตัว</b></div>
          <div className="ck gap"><span style={{fontWeight:800}}>ตุ๊กตาหาย</span><b className={prizeGap<=1?'t-green':'t-red'} style={{fontSize:22}}>{prizeGap>0?'−':''}{Math.abs(prizeGap)} ตัว</b></div>
        </div>
        <div className={`alert ${willFlag?'':'ok'}`}>
          <div style={{fontSize:22}}>{willFlag?'⚑':'✓'}</div>
          <div>
            <div className="fb" style={{fontWeight:800,fontSize:15}}>{willFlag?'พบส่วนต่างเกิน 5% · จะ flag เป็น Anomaly':'ทุกอย่างตรง · ปิดรอบได้เลย'}</div>
            <div className="fb" style={{fontWeight:700,fontSize:13,opacity:.8,marginTop:2}}>
              {willFlag? `${flagged.length} ตู้มีปัญหา · เจ้าของจะตรวจก่อนเข้ารายงาน` : 'เข้ารายงานอัตโนมัติ'}
            </div>
          </div>
        </div>
      </div>
      <div className="m-foot">
        <button className="btn btn-primary btn-lg btn-block" onClick={onDone}>
          {willFlag?'ส่งให้เจ้าของตรวจ':'ปิดรอบ · เข้ารายงาน'}
        </button>
      </div>
    </>
  );
}

// ---------- DONE ----------
function Done({ bid, onHome }) {
  return (
    <div className="m-body" style={{justifyContent:'center',alignItems:'center',textAlign:'center',gap:18}}>
      <div className="mascot" style={{width:120,height:120,background:'var(--green)',fontSize:54}}>✓</div>
      <div style={{fontFamily:'var(--f-th)',fontWeight:600,fontSize:26}}>ส่งรอบเรียบร้อย!</div>
      <div className="fb" style={{fontWeight:700,fontSize:16,color:'var(--ink-soft)',maxWidth:280}}>
        {CF.branchById(bid).name} · 6 ตู้ · รูปยืนยันครบ ส่งเข้าระบบแล้ว
      </div>
      <button className="btn btn-primary btn-lg" onClick={onHome} style={{marginTop:8}}>กลับหน้าแรก</button>
    </div>
  );
}

// ---------- ROOT ----------
const SKEY = 'cf_staff_v1';
function App() {
  const [staff, setStaff] = useState(()=>{ try { return JSON.parse(localStorage.getItem(SKEY)); } catch { return null; } });
  const [view, setView] = useState({ name:'home' });
  const go = v => { setView(v); window.scrollTo(0,0); };
  const login = s => { localStorage.setItem(SKEY, JSON.stringify(s)); setStaff(s); go({name:'home'}); };
  const logout = () => { localStorage.removeItem(SKEY); setStaff(null); };

  if (!staff) return <Login onLogin={login}/>;
  if (view.name==='home') return <Home staff={staff} onPick={bid=>go({name:'session',bid})} onLogout={logout}
    onHistory={()=>go({name:'history'})} onBroken={()=>go({name:'broken'})}/>;
  if (view.name==='history') return <History staff={staff} onBack={()=>go({name:'home'})}/>;
  if (view.name==='broken') return <ReportBroken staff={staff} onBack={()=>go({name:'home'})}/>;
  if (view.name==='session') return <Session bid={view.bid} onBack={()=>go({name:'home'})}
    onMachine={code=> code==='__close__' ? go({name:'close',bid:view.bid}) : go({name:'machine',bid:view.bid,code})}/>;
  if (view.name==='machine') return <Machine bid={view.bid} code={view.code}
    onBack={()=>go({name:'session',bid:view.bid})} onSaved={()=>go({name:'session',bid:view.bid})}/>;
  if (view.name==='close') return <Close bid={view.bid} onBack={()=>go({name:'session',bid:view.bid})}
    onDone={()=>{ CF.clearSession(view.bid); go({name:'done',bid:view.bid}); }}/>;
  if (view.name==='done') return <Done bid={view.bid} onHome={()=>go({name:'home'})}/>;
  return null;
}
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
